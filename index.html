<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>更新進捗管理</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e2e0da;
    --text: #26251f;
    --text-muted: #75726a;
    --accent: #3c5a99;
    --danger-bg: #fcebeb; --danger-text: #a32d2d;
    --warn-bg: #faeeda; --warn-text: #854f0b;
    --done-bg: #eaf3de; --done-text: #3b6d11;
    --na-bg: #f1efe8; --na-text: #75726a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 2px; }
  .sub { font-size: 13px; color: var(--text-muted); margin: 0 0 20px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .tab.active { border-color: var(--accent); background: #eef2fa; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 16px;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row span { font-size: 13.5px; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 6px;
    border: none; min-width: 74px; text-align: center;
  }
  .badge.未着手 { background: var(--danger-bg); color: var(--danger-text); }
  .badge.進行中 { background: var(--warn-bg); color: var(--warn-text); }
  .badge.完了 { background: var(--done-bg); color: var(--done-text); }
  .badge.対象外 { background: var(--na-bg); color: var(--na-text); }
  .badge.editable { cursor: pointer; }
  .overall {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; margin-top: 8px; font-size: 14px;
  }
  .overall b { font-size: 18px; font-weight: 600; }
  .footer { margin-top: 20px; font-size: 12px; color: var(--text-muted); text-align: center; }
  .editbar {
    display: flex; gap: 8px; align-items: center; margin-bottom: 16px;
    font-size: 12px; color: var(--text-muted); flex-wrap: wrap;
  }
  .editbar button, .editbar input {
    font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card);
  }
  .editbar button { cursor: pointer; }
  .status-msg { font-size: 12px; color: var(--text-muted); min-height: 16px; }
  .note {
    font-size: 12px; color: var(--text-muted); background: #f1efe8; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 16px; line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">更新進捗管理</h1>
  <p class="sub" id="subtitle"></p>

  <div class="note">
    このページは進捗状況（未着手／進行中／完了／対象外）のみを共有するためのものです。金額や滞納等の詳細情報はここには載せていません。
  </div>

  <div class="editbar">
    <span id="editState">閲覧モード</span>
    <button id="toggleEdit">編集モードにする</button>
    <span class="status-msg" id="statusMsg"></span>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
  <div class="overall" id="overallBox">
    <span>全体進捗</span>
    <b id="overall">-</b>
  </div>
  <div class="footer">GARNET RESIDENCE 京都辰巳・不動産事業部内共有ページ</div>
</div>

<script>
const STATUS_CYCLE = ["未着手","進行中","完了","対象外"];
let DATA = null;
let activeRoom = null;
let editMode = false;
let token = localStorage.getItem("gh_pat") || "";

function ghConfig() {
  const host = location.hostname;
  const owner = host.split(".")[0];
  const parts = location.pathname.split("/").filter(Boolean);
  const repo = parts[0] || "";
  return { owner, repo, branch: "main" };
}

async function loadData() {
  const { owner, repo, branch } = ghConfig();
  const url = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/data.json?t=${Date.now()}`;
  const res = await fetch(url);
  DATA = await res.json();
  document.getElementById("title").textContent = DATA.property + " 更新進捗";
  document.getElementById("subtitle").textContent = DATA.cycle + (DATA.last_updated ? " ／ 最終更新: " + DATA.last_updated : "");
  activeRoom = Object.keys(DATA.rooms)[0];
  render();
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  Object.keys(DATA.rooms).forEach(r => {
    const done = DATA.rooms[r].statuses.filter(s => s === "完了").length;
    const btn = document.createElement("button");
    btn.className = "tab" + (r === activeRoom ? " active" : "");
    btn.textContent = r + "号室 (" + done + "/" + DATA.todos.length + ")";
    btn.onclick = () => { activeRoom = r; render(); };
    tabs.appendChild(btn);
  });
}

function renderPanel() {
  const panels = document.getElementById("panels");
  panels.innerHTML = "";
  const room = DATA.rooms[activeRoom];
  const card = document.createElement("div");
  card.className = "card";
  DATA.todos.forEach((label, i) => {
    const row = document.createElement("div");
    row.className = "row";
    const span = document.createElement("span");
    span.textContent = label;
    const badge = document.createElement("button");
    const st = room.statuses[i];
    badge.className = "badge " + st + (editMode ? " editable" : "");
    badge.textContent = st;
    badge.disabled = !editMode;
    badge.onclick = async () => {
      const idx = STATUS_CYCLE.indexOf(room.statuses[i]);
      room.statuses[i] = STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
      render();
      await commitData();
    };
    row.appendChild(span);
    row.appendChild(badge);
    card.appendChild(row);
  });
  panels.appendChild(card);
}

function renderOverall() {
  let done = 0, total = 0;
  Object.values(DATA.rooms).forEach(r => {
    done += r.statuses.filter(s => s === "完了").length;
    total += r.statuses.length;
  });
  document.getElementById("overall").textContent = done + " / " + total + " 完了";
}

function render() {
  renderTabs();
  renderPanel();
  renderOverall();
}

async function commitData() {
  const msgEl = document.getElementById("statusMsg");
  if (!token) { msgEl.textContent = "未保存（編集モードのトークンが未設定です）"; return; }
  const { owner, repo, branch } = ghConfig();
  msgEl.textContent = "保存中...";
  try {
    DATA.last_updated = new Date().toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
    const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json?ref=${branch}`, {
      headers: { Authorization: `token ${token}` }
    });
    if (!getRes.ok) throw new Error("読み込み失敗 (" + getRes.status + ")");
    const getJson = await getRes.json();
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2))));
    const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json`, {
      method: "PUT",
      headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: "update progress " + DATA.last_updated,
        content,
        sha: getJson.sha,
        branch
      })
    });
    if (!putRes.ok) throw new Error("保存失敗 (" + putRes.status + ")");
    msgEl.textContent = "保存しました（反映まで数十秒かかる場合があります）";
  } catch (e) {
    msgEl.textContent = "エラー: " + e.message;
  }
}

document.getElementById("toggleEdit").addEventListener("click", () => {
  if (!editMode) {
    const input = prompt("GitHubのPersonal Access Token（このリポジトリのみ Contents:Write 権限を付与したもの）を入力してください。\nこの端末のブラウザにのみ保存され、他の人には送信されません。");
    if (!input) return;
    token = input.trim();
    localStorage.setItem("gh_pat", token);
    editMode = true;
    document.getElementById("editState").textContent = "編集モード";
    document.getElementById("toggleEdit").textContent = "閲覧モードに戻す";
  } else {
    editMode = false;
    document.getElementById("editState").textContent = "閲覧モード";
    document.getElementById("toggleEdit").textContent = "編集モードにする";
  }
  render();
});

loadData().catch(e => {
  document.getElementById("statusMsg").textContent = "データの読み込みに失敗しました: " + e.message;
});
</script>
</body>
</html>
